        - text: What is a clinical trial?
      - article [ref=e44]:
        - generic [ref=e45]: You
        - text: What happens during a screening visit?
      - article [ref=e46]:
        - generic [ref=e47]: TrialGuide
        - text: "A screening visit is used to see whether a clinical trial may be appropriate for you and whether you meet its eligibility criteria. The exact process depends on the study. It commonly includes: - Reviewing the informed-consent form and giving you time to ask questions before you agree to screening procedures. - Discussing your medical history, medications, and relevant past treatments. - A physical exam and measurements such as blood pressure, height, or weight. - Tests required by the study, which might include blood or urine tests, imaging, an ECG, or other assessments. - Reviewing the results against the study's inclusion and exclusion criteria. Screening does not guarantee that you can enroll, and you can decide not to continue. Before sharing information here, avoid names, medical record numbers, or other identifying health information. A useful question for the study team is: “What tests will happen during screening, what are their risks or costs, and when will I learn whether I’m eligible?”"
