name: clinical-trial-chat
services:
  web:
    project: ./src/ClinicalTrialChat.Web
    dist: .
    host: staticwebapp
  chat:
    project: ./src/ClinicalTrialChat.Api
    language: dotnet
    host: containerapp
    docker:
      remoteBuild: true
  probe:
    project: ./src/ClinicalTrialChat.Probe
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
